<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Input Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Outfit&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="card product-form-card shadow">
                    <div class="card-header text-center">
                        <h3 class="mb-0">Add New Product</h3>
                    </div>

                    <div class="card-body p-4">
                        <!--
                            Form sementara dikirim ke product-form.php
                            untuk proses validasi PHP.
                        -->
                        <form action="product-form.php" method="POST" enctype="multipart/form-data">
                            <!-- Product Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Product Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Enter product name"
                                    required
                                >
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <textarea
                                    class="form-control"
                                    id="description"
                                    name="description"
                                    rows="4"
                                    placeholder="Enter product description"
                                    required
                                ></textarea>
                            </div>

                            <!-- Image -->
                            <div class="mb-3">
                                <label for="image" class="form-label">
                                    Product Image
                                </label>

                                <input
                                    type="file"
                                    class="form-control"
                                    id="image"
                                    name="image"
                                    accept="image/jpeg,image/png,image/webp"
                                    required
                                >
                            </div>

                            <!-- Price -->
                            <div class="mb-3">
                                <label for="price" class="form-label">
                                    Price
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        Rp
                                    </span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="price"
                                        name="price"
                                        placeholder="100000"
                                        min="0"
                                        step="1"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Stock -->
                            <div class="mb-3">
                                <label for="stock" class="form-label">
                                    Stock
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="stock"
                                    name="stock"
                                    placeholder="10"
                                    min="0"
                                    step="1"
                                    required
                                >
                            </div>

                            <!-- Category -->
                            <div class="mb-4">
                                <label for="category" class="form-label">
                                    Category
                                </label>

                                <select
                                    class="form-select"
                                    id="category"
                                    name="category"
                                    required
                                >
                                    <option value="" selected disabled>
                                        Choose category
                                    </option>

                                    <option value="Elektronik">
                                        Elektronik
                                    </option>

                                    <option value="Aksesoris">
                                        Aksesoris
                                    </option>

                                    <option value="Fashion">
                                        Fashion
                                    </option>

                                    <option value="Gaming">
                                        Gaming
                                    </option>

                                    <option value="Lainnya">
                                        Lainnya
                                    </option>
                                </select>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2">
                                <button 
                                    type="reset"
                                    class="btn btn-secondary w-50">
                                    Reset
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-primary w-50">
                                    Add Product
                                </button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        const form = document.querySelector("form");

        // Simpan data ketika user mengetik
        form.addEventListener("input", function () {

            const formData = {
                name: document.getElementById("name").value,
                description: document.getElementById("description").value,
                price: document.getElementById("price").value,
                stock: document.getElementById("stock").value,
                category: document.getElementById("category").value
            };

            sessionStorage.setItem(
                "productFormData",
                JSON.stringify(formData)
            );

        });


        // Kembalikan data ketika halaman dibuka
        window.addEventListener("DOMContentLoaded", function () {

            const savedData =
                sessionStorage.getItem("productFormData");

            if (!savedData) {
                return;
            }

            const formData = JSON.parse(savedData);

            document.getElementById("name").value =
                formData.name || "";

            document.getElementById("description").value =
                formData.description || "";

            document.getElementById("price").value =
                formData.price || "";

            document.getElementById("stock").value =
                formData.stock || "";

            document.getElementById("category").value =
                formData.category || "";

        });


        // Hapus data setelah form berhasil dikirim
        form.addEventListener("submit", function () {

            // Data akan tetap tersimpan sementara.
            // PHP yang menentukan apakah proses berhasil.
        });
    </script>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
