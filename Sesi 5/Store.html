<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arctic Official Online Store">
    <meta name="author" content="Arctic">
    <meta name="keywords" content="Arctic, Online Store, Online Shop, Tech, Setup">

    <title>ArcticShop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../Sesi 5/CSS/style.css">

    <!-- JS -->
    <script src="../Sesi 5/JS/products.js"></script>
    <script src="../Sesi 5/JS/app.js"></script>

</head>
<body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="#">
                <i class="bi bi-bag-fill"></i>
                ArcticStore
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Produk
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link position-relative" href="#">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- ================= HERO ================= -->
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-4 fw-bold">
                        Belanja Jadi
                        <span class="text-warning">Lebih Mudah</span>
                    </h1>

                    <p class="lead mt-3">
                        Temukan berbagai produk elektronik,
                        aksesoris, dan gadget dengan harga terbaik.
                    </p>

                    <button class="btn btn-warning btn-lg mt-3">
                        Belanja Sekarang
                    </button>
                </div>

                <div class="col-lg-6 text-center">
                    <img src="images/banner.jpg"
                        class="img-fluid hero-img"
                        alt="Hero">
                </div>
            </div>
        </div>
    </section>

    <!-- ================= CONTENT ================= -->

    <section class="container py-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 mb-4">

                <div class="card shadow-sm">
                    <div class="card-header fw-bold">
                        Filter Produk
                    </div>

                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label">
                                Cari Produk
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Cari...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Kategori
                            </label>

                            <select class="form-select">
                                <option>Semua</option>
                                <option>Laptop</option>
                                <option>Smartphone</option>
                                <option>Gaming</option>
                                <option>Monitor</option>
                            </select>
                        </div>

                        <div>
                            <label class="form-label">
                                Harga
                            </label>

                            <select class="form-select">
                                <option>Semua</option>
                                <option>< Rp500.000</option>
                                <option>Rp500rb - Rp2jt</option>
                                <option>Rp2jt - Rp5jt</option>
                                <option>> Rp5jt</option>
                            </select>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Product Area -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Produk Terbaru</h3>
                    <span
                        class="badge bg-primary"
                        id="product-count">
                    </span>
                    <select class="form-select w-auto">
                        <option>Urutkan</option>
                        <option>Harga Terendah</option>
                        <option>Harga Tertinggi</option>
                        <option>Nama A-Z</option>
                    </select>
                </div>

                <div class="row g-4 id="product-list">
                    <!-- Dummy Product -->
                    <div class="col-md-6 col-xl-4">
                        <div class="card product-card shadow-sm">
                            <img
                                src="https://placehold.co/600x400"
                                class="card-img-top">

                            <div class="card-body">
                                <span class="badge bg-primary">
                                    Laptop
                                </span>

                                <h5 class="mt-3">
                                    ASUS Vivobook
                                </h5>

                                <p class="text-muted">
                                    Laptop Core i5 Generasi terbaru.
                                </p>

                                <h4 class="text-primary">
                                    Rp8.500.000
                                </h4>

                                <button class="btn btn-warning w-100 mt-3">
                                    <i class="bi bi-cart-plus"></i>
                                    Tambah ke Keranjang
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Nanti Bagian 3 akan diisi JavaScript -->

                </div>
            </div>
        </div>
    </section>
    <!-- ================= FOOTER ================= -->
    <footer class="text-center text-white py-4">
        © 2026 ArcticShop | E-Commerce
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
