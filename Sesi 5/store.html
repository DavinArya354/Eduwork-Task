<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arctic Official Online Store">
    <meta name="author" content="Arctic">
    <meta name="keywords" content="Arctic, Online Store, Online Shop, Tech, Setup">

    <title>Arctic Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Outfit&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-bag-fill"></i>
                ArcticStore
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Produk
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span
                                class="top-0 start-100 translate-middle cart-badge"
                                id="cart-count">
                                0
                            </span>
                        </a>
                    </li>
                    <!-- USER -->
                    <li class="nav-item user-nav-item">
                        <a class="nav-link user-nav-link" href="user.html">
                            <span id="nav-username">Login</span>
                            <img id="nav-profile-photo"
                                src="..\Resources\photo_2026-07-09_14-18-46.jpg"
                                alt="Profile"
                                class="nav-profile-photo">
                            
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- ================= HERO ================= -->
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-4 fw-bold">
                        Belanja Jadi
                        <span class="text-warning">Lebih Mudah</span>
                    </h1>

                    <p class="p-hero mt-3">
                        Temukan berbagai produk elektronik,
                        aksesoris, dan gadget dengan harga terbaik.
                    </p>

                    <button class="btn btn-warning btn-lg mt-3">
                        Belanja Sekarang
                    </button>
                </div>

                <div class="col-lg-6 text-center">
                    <img src="images/banner.jpg"
                        class="img-fluid hero-img"
                        alt="Hero">
                </div>
            </div>
        </div>
    </section>

    <!-- ================= CONTENT ================= -->

    <section class="container py-5">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header fw-bold">
                        Filter Produk
                    </div>

                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label">
                                Cari Produk
                            </label>

                            <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Cari...">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Kategori
                            </label>

                            <select id="categoryFilter" class="form-select">
                                <option value="Semua">Semua</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Smartphone">Smartphone</option>
                                <option value="Aksesoris">Aksesoris</option>
                                <option value="Monitor">Monitor</option>
                            </select>
                        </div>

                        <div>
                            <label class="form-label">
                                Harga
                            </label>

                            <select id="priceFilter" class="form-select">
                                <option value="all">Semua</option>
                                <option value="0-500000">< Rp500.000</option>
                                <option value="500000-2000000">Rp500rb - Rp2jt</option>
                                <option value="2000000-5000000">Rp2jt - Rp5jt</option>
                                <option value="5000000+">> Rp5jt</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Product Area -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Produk Terbaru</h3>
                    <span
                        class="badge bg-primary"
                        id="product-count">
                    </span>
                    <select id="sortFilter" class="form-select w-auto">
                        <option value="">Urutkan</option>
                        <option value="low-high">Harga Terendah</option>
                        <option value="high-low">Harga Tertinggi</option>
                        <option value="az">Nama A-Z</option>
                        <option value="za">Nama Z-A</option>
                    </select>
                </div>

                <div class="row g-4" id="product-list">
                    <div class="card-header">
                        <span class="badge">
                                    Laptop
                        </span>

                        <h5 class="mt-3">
                            ASUS Vivobook
                        </h5>

                        <p class="text-muted">
                            Laptop Core i5 Generasi terbaru.
                        </p>

                        <h4 class="text-primary">
                            Rp8.500.000
                        </h4>

                        <button class="btn btn-warning w-100 mt-3">
                            <i class="bi bi-cart-plus"></i>
                            Tambah ke Keranjang
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ================= FOOTER ================= -->
    <footer class="text-center text-white py-4">
        © 2026 ArcticShop | E-Commerce
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/products.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
