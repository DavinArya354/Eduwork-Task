<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arctic Official Online Store">
    <meta name="author" content="Arctic">
    <meta name="keywords" content="Arctic, Online Store, Online Shop, Tech, Setup">

    <title>Arctic Store Cart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Outfit&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="#">
                <i class="bi bi-bag-fill"></i>
                ArcticStore
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="shop.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Produk
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active position-relative" href="#">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle cart-badge"
                                id="cart-count">
                                0
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <h1 class="mb-4">
            Keranjang
        </h1>

        <div class="cart-layout">
            <!-- =========================
                PRODUK
            ========================== -->
            <section class="cart-products">
                <div class="card shadow-sm">

                    <div class="card-header bg-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="check-all">
                                <label
                                    class="form-check-label"
                                    for="check-all">
                                    Pilih Semua
                                </label>
                            </div>

                            <button
                                class="btn btn-danger"
                                onclick="clearCart()">
                                <i class="bi bi-trash"></i>
                                Kosongkan Keranjang
                            </button>
                        </div>
                    </div>

                    <div class="card-body">
                        <div
                            id="cart-items" class="cart-list">
                        </div>
                    </div>
                </div>
            </section>

            <!-- =========================
                RINGKASAN
            ========================== -->
            <aside class="cart-summary">
                <div class="summary-card">
                    <h4>
                        Ringkasan Belanja
                    </h4>

                    <hr>

                    <div class="summary-row">
                        <span>
                            Produk Dipilih
                        </span>

                        <span id="selected-count">
                            0
                        </span>
                    </div>

                    <div class="summary-row">
                        <span>
                            Total Item
                        </span>

                        <span id="selected-qty">
                            0
                        </span>
                    </div>
                    <hr>
                    <div class="summary-row">
                        <strong>
                            Total
                        </strong>

                        <strong id="grand-total">
                            Rp0
                        </strong>
                    </div>
                    <button
                        id="checkout-btn" class="btn btn-success w-100 mt-3">
                        Checkout
                    </button>
                </div>
            </aside>
        </div>
    </main>
    <script src="JS/utils.js"></script>
    <script src="JS/cart.js"></script>
</body>
</html>
